<rect x="1040" y="80" width="14" height="14" fill="#2a2a28" stroke="#6b6a64"/><text class="s" x="1062" y="92">your code</text>
<rect x="1040" y="104" width="14" height="14" fill="#2b2840" stroke="#8f88e0"/><text class="s" x="1062" y="116">UClass (class descriptor)</text>
<rect x="1040" y="128" width="14" height="14" fill="#1f3530" stroke="#4fb894"/><text class="s" x="1062" y="140">actual object (an instance)</text>
<line x1="1040" y1="160" x2="1068" y2="160" stroke="#9c9a92" stroke-dasharray="6 4"/><text class="s" x="1076" y="164">creates</text>
<line x1="1040" y1="182" x2="1068" y2="182" stroke="#9c9a92"/><text class="s" x="1076" y="186">points to / uses</text>
</svg>
